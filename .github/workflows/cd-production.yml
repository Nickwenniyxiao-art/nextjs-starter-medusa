name: "CD — Production"

on:
  push:
    branches: [main]

concurrency:
  group: cd-production-frontend
  cancel-in-progress: true

jobs:
  deploy-production:
    name: "🚀 Deploy → Production"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Deploy to production
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /opt/nordhjem/storefront
            echo "=== Pulling latest (main) ==="
            git fetch origin main
            git reset --hard origin/main
            echo "=== Installing dependencies ==="
            corepack enable
            yarn install
            echo "=== Building ==="
            yarn build
            echo "=== Restarting PM2 ==="
            PORT=8000 pm2 restart storefront --update-env || \
              PORT=8000 pm2 start npm --name storefront -- start
            pm2 save
            echo "=== Deploy to production complete ==="

      - name: Health check (production)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 2m
          script: |
            sleep 10
            for i in 1 2 3 4 5; do
              STATUS=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost:8000 2>/dev/null || echo "000")
              if [ "$STATUS" = "200" ] || [ "$STATUS" = "307" ] || [ "$STATUS" = "301" ]; then
                echo "✅ Production health check passed (HTTP $STATUS)"
                exit 0
              fi
              echo "Attempt $i: HTTP $STATUS, waiting 10s..."
              sleep 10
            done
            echo "❌ Health check failed"
            pm2 logs storefront --lines 20 --nostream 2>/dev/null || true
            exit 1

      - name: Log deployment event
        if: success()
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.BOT_PAT }}
          script: |
            const now = new Date().toISOString().replace('T', ' ').substring(0, 19);
            const sha = context.sha.substring(0, 7);
            const actor = context.actor;
            const newLine = `| ${now} | production | ${sha} | ${actor} | cd-production |`;

            let content, fileSha;
            try {
              const file = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: 'docs/DEPLOY-LOG.md',
                ref: 'develop'
              });
              content = Buffer.from(file.data.content, 'base64').toString('utf8');
              fileSha = file.data.sha;
            } catch (e) {
              content = '# 部署事件日志（前端）\n\n> 自动记录每次成功部署的时间、版本和环境。\n> 由 cd-staging.yml 和 cd-production.yml 自动更新。\n\n| 时间 (UTC) | 环境 | 版本 (SHA) | 触发者 | 工作流 |\n|------------|------|-----------|--------|--------|\n';
              fileSha = undefined;
            }

            content = content.trimEnd() + '\n' + newLine + '\n';

            const lines = content.split('\n');
            const headerLines = lines.slice(0, 7);
            const dataLines = lines.slice(7).filter((l) => l.startsWith('|') && !l.includes('---'));
            const trimmedData = dataLines.slice(-100);
            content = headerLines.join('\n') + '\n' + trimmedData.join('\n') + '\n';

            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: 'docs/DEPLOY-LOG.md',
              message: 'docs: log production deployment [skip ci]',
              content: Buffer.from(content).toString('base64'),
              branch: 'develop',
              ...(fileSha ? { sha: fileSha } : {})
            });

            console.log(`✅ Logged production deployment: ${sha} by ${actor}`);
