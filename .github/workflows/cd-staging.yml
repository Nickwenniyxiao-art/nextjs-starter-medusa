name: "CD — Staging"

on:
  push:
    branches: [staging]

concurrency:
  group: cd-staging-frontend
  cancel-in-progress: true

jobs:
  deploy-staging:
    name: "🚀 Deploy → Staging"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy to staging environment
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /opt/nordhjem/storefront-staging
            echo "=== Pulling latest (staging) ==="
            git fetch origin staging
            git reset --hard origin/staging

            echo "=== Ensuring .env is correct ==="
            grep -q "^MEDUSA_BACKEND_URL=" .env 2>/dev/null || echo "MEDUSA_BACKEND_URL=http://66.94.127.117:9002" >> .env
            sed -i 's|^MEDUSA_BACKEND_URL=.*|MEDUSA_BACKEND_URL=http://66.94.127.117:9002|' .env

            echo "=== Installing dependencies ==="
            corepack enable
            yarn install

            echo "=== Building ==="
            yarn build

            echo "=== Setting up standalone mode ==="
            cp -r public .next/standalone/public
            cp -r .next/static .next/standalone/.next/static
            cp .env .next/standalone/.env

            echo "=== Restarting PM2 (standalone) ==="
            pm2 delete storefront-staging 2>/dev/null || true
            cd /opt/nordhjem/storefront-staging
            PORT=8002 HOSTNAME=0.0.0.0 MEDUSA_BACKEND_URL=http://66.94.127.117:9002 \
              pm2 start .next/standalone/server.js --name storefront-staging \
              --cwd /opt/nordhjem/storefront-staging
            pm2 save
            echo "=== Deploy to staging complete ==="

      - name: Health check (staging)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 2m
          script: |
            sleep 10
            for i in 1 2 3 4 5; do
              STATUS=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost:8002/en/dk 2>/dev/null || echo "000")
              if [ "$STATUS" = "200" ] || [ "$STATUS" = "307" ] || [ "$STATUS" = "301" ]; then
                echo "✅ Staging env health check passed (HTTP $STATUS)"
                exit 0
              fi
              echo "Attempt $i: HTTP $STATUS, waiting 10s..."
              sleep 10
            done
            echo "❌ Health check failed"
            exit 1

      - name: Log deployment event
        if: success()
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.BOT_PAT }}
          script: |
            const now = new Date().toISOString().replace('T', ' ').substring(0, 19);
            const sha = context.sha.substring(0, 7);
            const actor = context.actor;
            const newLine = `| ${now} | staging | ${sha} | ${actor} | cd-staging |`;

            let content, fileSha;
            try {
              const file = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: 'docs/DEPLOY-LOG.md',
                ref: 'develop'
              });
              content = Buffer.from(file.data.content, 'base64').toString('utf8');
              fileSha = file.data.sha;
            } catch (e) {
              content = '# 部署事件日志（前端）\n\n> 自动记录每次成功部署的时间、版本和环境。\n> 由 cd-staging.yml 和 cd-production.yml 自动更新。\n\n| 时间 (UTC) | 环境 | 版本 (SHA) | 触发者 | 工作流 |\n|------------|------|-----------|--------|--------|\n';
              fileSha = undefined;
            }

            content = content.trimEnd() + '\n' + newLine + '\n';

            const lines = content.split('\n');
            const headerLines = lines.slice(0, 7);
            const dataLines = lines.slice(7).filter((l) => l.startsWith('|') && !l.includes('---'));
            const trimmedData = dataLines.slice(-100);
            content = headerLines.join('\n') + '\n' + trimmedData.join('\n') + '\n';

            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: 'docs/DEPLOY-LOG.md',
              message: 'docs: log staging deployment [skip ci]',
              content: Buffer.from(content).toString('base64'),
              branch: 'develop',
              ...(fileSha ? { sha: fileSha } : {})
            });

            console.log(`✅ Logged staging deployment: ${sha} by ${actor}`);

  seed-staging:
    name: "🌱 Seed → Staging"
    needs: deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Seed staging environment
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 3m
          script: |
            bash /opt/nordhjem/scripts/seed-env.sh staging || echo "⚠️ Seed had warnings (non-fatal)"

            echo "=== Verifying seed data ==="
            PRODUCT_COUNT=$(curl -s http://localhost:9002/store/products | python3 -c "import sys,json; print(len(json.load(sys.stdin).get('products',[])))" 2>/dev/null || echo "0")
            echo "Products in staging environment: $PRODUCT_COUNT"
            if [ "$PRODUCT_COUNT" = "0" ]; then
              echo "⚠️ Warning: No products found after seed. E2E tests may skip product-dependent scenarios."
            fi

  e2e-staging:
    name: "🧪 E2E → Staging"
    needs: seed-staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install E2E dependencies
        working-directory: e2e-monitor
        run: npm ci
      - name: Install Playwright browsers
        working-directory: e2e-monitor
        run: npx playwright install chromium --with-deps
      - name: Run E2E tests against staging environment
        working-directory: e2e-monitor
        env:
          BASE_URL: http://${{ secrets.DEPLOY_HOST }}:8002
          API_URL: http://${{ secrets.DEPLOY_HOST }}:9002
          PUBLISHABLE_API_KEY: ${{ secrets.PUBLISHABLE_KEY_STAGING }}
        run: npx playwright test
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-staging
          path: e2e-monitor/playwright-report/
          retention-days: 30

  promote-to-production:
    name: "🔀 Promote → Production"
    needs: e2e-staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.BOT_PAT }}

      - name: Create promote PR (staging → main)
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT }}
          CD_PAT: ${{ secrets.CD_PAT }}
        run: |
          EXISTING_PR=$(gh pr list --repo ${{ github.repository }} --base main --head staging --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$EXISTING_PR" ] && [ "$EXISTING_PR" != "null" ]; then
            PR_NUMBER="$EXISTING_PR"
            echo "Promote PR #${PR_NUMBER} already exists"
          else
            PR_URL=$(gh pr create \
              --repo ${{ github.repository }} \
              --base main \
              --head staging \
              --title "release: promote staging → production" \
              --body "## 自动晋级 PR

Staging 部署 + E2E 测试全部通过。

**需要 Owner 手动 Approve 此 PR，合并后自动触发 CD Production 部署。**

| 检查项 | 状态 |
|-------|------|
| Staging 部署 | ✅ |
| E2E 测试 | ✅ |
| 等待 Owner Approve | ⏳ |")
            PR_NUMBER=$(echo "$PR_URL" | grep -oE '[0-9]+$')
            echo "Promote PR #${PR_NUMBER} created"
          fi

          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "✅ Promote PR #${PR_NUMBER} ready — waiting for Owner approval"
