name: Playwright Site Monitor

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: e2e-monitor
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e-monitor
        run: npx playwright install chromium --with-deps

      - name: Run smoke tests
        working-directory: e2e-monitor
        run: npx playwright test --project=chromium
        env:
          BASE_URL: https://nordhjem.store
          API_URL: http://66.94.127.117:9000
          PUBLISHABLE_API_KEY: pk_131083b02252b54782a42b83a9f1dd79b4bb01b6a9b409a252b104b965b977ea

      - name: Send Telegram alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
          MESSAGE="🔴 NordHjem 巡检告警 ($TIMESTAMP)%0A%0APlaywright 自动巡检发现异常，部分页面或功能可能不正常。%0A%0A查看详情: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MESSAGE}" \
            -d "parse_mode=HTML"
