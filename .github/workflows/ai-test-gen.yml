name: AI Test Generation

on:
  issues:
    types: [closed]
  push:
    branches: [develop]
    paths: ['docs/FEATURE-LIST.md']
  schedule:
    - cron: '0 2 * * 1'  # Weekly Monday 2am UTC
  workflow_dispatch:
    inputs:
      trigger:
        description: 'What triggered this: bug | feature | weekly | manual'
        required: false
        default: 'manual'

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  generate-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Determine trigger context
        id: context
        run: |
          if [ "${{ github.event_name }}" = "issues" ]; then
            LABELS="${{ join(github.event.issue.labels.*.name, ',') }}"
            if echo "$LABELS" | grep -qi "bug"; then
              echo "trigger=bug" >> $GITHUB_OUTPUT
              echo "context=Bug closed: ${{ github.event.issue.title }}" >> $GITHUB_OUTPUT
            else
              echo "trigger=issue" >> $GITHUB_OUTPUT
              echo "context=Issue closed: ${{ github.event.issue.title }}" >> $GITHUB_OUTPUT
            fi
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "trigger=feature" >> $GITHUB_OUTPUT
            echo "context=Feature list updated" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            echo "trigger=weekly" >> $GITHUB_OUTPUT
            echo "context=Weekly test coverage review" >> $GITHUB_OUTPUT
          else
            echo "trigger=${{ github.event.inputs.trigger || 'manual' }}" >> $GITHUB_OUTPUT
            echo "context=Manual trigger" >> $GITHUB_OUTPUT
          fi

      - name: Read relevant context files
        id: read-context
        run: |
          FEATURE_LIST=""
          TEST_REGISTRY=""
          ISSUE_BODY=""

          if [ -f "docs/FEATURE-LIST.md" ]; then
            FEATURE_LIST=$(head -100 docs/FEATURE-LIST.md)
          fi
          if [ -f "docs/TEST-REGISTRY.json" ]; then
            TEST_REGISTRY=$(cat docs/TEST-REGISTRY.json | head -200)
          fi
          if [ "${{ github.event_name }}" = "issues" ]; then
            ISSUE_BODY="${{ github.event.issue.body }}"
          fi

          echo "feature_list<<EOF" >> $GITHUB_OUTPUT
          echo "$FEATURE_LIST" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "issue_body<<EOF" >> $GITHUB_OUTPUT
          echo "$ISSUE_BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Log test generation event
        run: |
          echo "## AI Test Generation Triggered" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: ${{ steps.context.outputs.trigger }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Context**: ${{ steps.context.outputs.context }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time**: $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚙️ Test generation requires ANTHROPIC_API_KEY or OPENAI_API_KEY to be configured." >> $GITHUB_STEP_SUMMARY
          echo "When configured, AI will:" >> $GITHUB_STEP_SUMMARY
          echo "- Analyze trigger context" >> $GITHUB_STEP_SUMMARY
          echo "- Generate appropriate test scripts" >> $GITHUB_STEP_SUMMARY
          echo "- Submit PR with new tests" >> $GITHUB_STEP_SUMMARY
          echo "- Update TEST-REGISTRY.json" >> $GITHUB_STEP_SUMMARY
