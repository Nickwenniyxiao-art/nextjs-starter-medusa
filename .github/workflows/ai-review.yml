name: AI Code Review

on:
  pull_request:
    branches: [develop, staging, main]
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

# ──────────────────────────────────────────────────────────────
# Multi-AI Review Framework
# ──────────────────────────────────────────────────────────────
# Architecture: Each AI reviewer runs as an independent job.
# To add a new reviewer:
#   1. Copy an existing reviewer job
#   2. Change the model/API endpoint
#   3. Adjust the review prompt for that model's strengths
#   4. Add the new job name to Branch Protection required checks
#
# Current reviewers:
#   - reviewer-1 (OpenAI GPT) \u2014 General code quality + logic
#
# Planned:
#   - reviewer-2 (Claude) \u2014 Security + edge cases
#   - reviewer-3 (Perplexity) \u2014 Architecture consistency
# ──────────────────────────────────────────────────────────────

jobs:
  # \u2500\u2500 Shared: Extract PR diff \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
  extract-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      diff_b64: ${{ steps.diff.outputs.diff_b64 }}
      files_changed: ${{ steps.diff.outputs.files_changed }}
      has_code_changes: ${{ steps.diff.outputs.has_code_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract PR diff
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Get the diff
          DIFF=$(gh pr diff ${{ github.event.pull_request.number }} --repo ${{ github.repository }} 2>/dev/null || echo "")

          # Get changed files list
          FILES=$(gh pr diff ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --name-only 2>/dev/null || echo "")

          # Check if there are meaningful code changes using exclusion-based rules
          HAS_CODE=false
          for f in $FILES; do
            case "$f" in
              yarn.lock|package-lock.json|*.min.js|*.min.css|*.png|*.jpg|*.jpeg|*.gif|*.svg|*.ico|*.woff|*.woff2|*.ttf|*.eot)
                # Skip lock files, minified assets, and static resources
                ;;
              *)
                HAS_CODE=true
                ;;
            esac
          done

          # Save diff to file (too large for env vars)
          echo "$DIFF" > /tmp/pr_diff.txt

          # Truncate to ~8000 chars for API context limit and encode to base64
          DIFF_B64=$(head -c 8000 /tmp/pr_diff.txt | base64 -w 0)

          echo "diff_b64=$DIFF_B64" >> "$GITHUB_OUTPUT"
          echo "files_changed=$(echo "$FILES" | tr '\n' ',')" >> "$GITHUB_OUTPUT"
          echo "has_code_changes=$HAS_CODE" >> "$GITHUB_OUTPUT"

          echo "\ud83d\udcca Changed files: $(echo "$FILES" | wc -w)"
          echo "\ud83d\udcca Has code changes: $HAS_CODE"

  # \u2500\u2500 Reviewer 1: OpenAI GPT \u2014 General Quality \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
  reviewer-1-quality:
    needs: extract-diff
    if: needs.extract-diff.outputs.has_code_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: AI Review \u2014 Code Quality & Logic
        id: review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "\u26a0\ufe0f OPENAI_API_KEY not set, skipping AI review"
            echo "result=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Build the review prompt
          PROMPT=$(cat <<'PROMPT_END'
          \u4f60\u662f\u4e00\u4f4d\u8d44\u6df1\u7684 Next.js + TypeScript \u524d\u7aef\u4ee3\u7801\u5ba1\u67e5\u4e13\u5bb6\u3002
          \u8bf7\u5ba1\u67e5\u4ee5\u4e0b Pull Request \u7684\u4ee3\u7801\u53d8\u66f4\uff0c\u4ece\u4ee5\u4e0b\u7ef4\u5ea6\u7ed9\u51fa\u8bc4\u4ef7\uff1a

          ## \u5ba1\u67e5\u7ef4\u5ea6
          1. **\u903b\u8f91\u6b63\u786e\u6027** \u2014 \u662f\u5426\u6709 bug\u3001\u8fb9\u754c\u60c5\u51b5\u9057\u6f0f\u3001\u7a7a\u503c\u5904\u7406
          2. **\u7c7b\u578b\u5b89\u5168** \u2014 TypeScript \u7c7b\u578b\u662f\u5426\u6b63\u786e\uff0c\u662f\u5426\u6709 any \u6ee5\u7528
          3. **\u6027\u80fd** \u2014 \u662f\u5426\u6709\u4e0d\u5fc5\u8981\u7684\u91cd\u6e32\u67d3\u3001\u5185\u5b58\u6cc4\u6f0f\u98ce\u9669\u3001N+1 \u67e5\u8be2
          4. **\u5b89\u5168** \u2014 XSS\u3001\u654f\u611f\u4fe1\u606f\u6cc4\u6f0f\u3001\u4e0d\u5b89\u5168\u7684 API \u8c03\u7528
          5. **\u4ee3\u7801\u98ce\u683c** \u2014 \u547d\u540d\u89c4\u8303\u3001\u91cd\u590d\u4ee3\u7801\u3001\u53ef\u8bfb\u6027

          ## \u8f93\u51fa\u683c\u5f0f
          \u5bf9\u6bcf\u4e2a\u7ef4\u5ea6\u7ed9\u51fa\uff1a
          - \u2705 \u901a\u8fc7 \u2014 \u6ca1\u6709\u95ee\u9898
          - \u26a0\ufe0f \u5efa\u8bae \u2014 \u975e\u963b\u585e\u6027\u5efa\u8bae
          - \u274c \u963b\u585e \u2014 \u5fc5\u987b\u4fee\u590d\u624d\u80fd\u5408\u5e76

          \u6700\u540e\u7ed9\u51fa\u603b\u4f53\u8bc4\u5206\uff1a
          - **APPROVE** \u2014 \u53ef\u4ee5\u5408\u5e76
          - **COMMENT** \u2014 \u6709\u5efa\u8bae\u4f46\u4e0d\u963b\u585e
          - **REQUEST_CHANGES** \u2014 \u6709\u963b\u585e\u6027\u95ee\u9898\uff0c\u5fc5\u987b\u4fee\u590d

          ## PR Diff
          PROMPT_END
          )

          # Call OpenAI API
          DIFF=$(echo '${{ needs.extract-diff.outputs.diff_b64 }}' | base64 -d)

          RESPONSE=$(curl -s https://api.openai.com/v1/chat/completions \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg prompt "$PROMPT" \
              --arg diff "$DIFF" \
              '{
                model: "gpt-4o-mini",
                messages: [
                  {role: "system", content: $prompt},
                  {role: "user", content: ("\u8bf7\u5ba1\u67e5\u4ee5\u4e0b\u4ee3\u7801\u53d8\u66f4:\n\n" + $diff)}
                ],
                temperature: 0.3,
                max_tokens: 2000
              }')")

          # Extract the review content
          REVIEW=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // "API call failed"')

          if [ "$REVIEW" = "API call failed" ] || [ -z "$REVIEW" ]; then
            echo "\u274c AI review API call failed"
            echo "$RESPONSE" | jq .
            echo "result=error" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # Determine if there are blocking issues
          if echo "$REVIEW" | grep -q "REQUEST_CHANGES"; then
            echo "result=request_changes" >> "$GITHUB_OUTPUT"
          elif echo "$REVIEW" | grep -q "COMMENT"; then
            echo "result=comment" >> "$GITHUB_OUTPUT"
          else
            echo "result=approve" >> "$GITHUB_OUTPUT"
          fi

          # Save review for comment step
          echo "$REVIEW" > /tmp/review.md
          echo "review_body<<REVIEW_EOF" >> "$GITHUB_OUTPUT"
          echo "$REVIEW" >> "$GITHUB_OUTPUT"
          echo "REVIEW_EOF" >> "$GITHUB_OUTPUT"

      - name: Post review comment on PR
        if: always() && steps.review.outputs.result != 'skip'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let review = '';
            try {
              review = fs.readFileSync('/tmp/review.md', 'utf8');
            } catch {
              review = 'AI review completed but output could not be read.';
            }

            const result = '${{ steps.review.outputs.result }}';
            const icon = result === 'approve' ? '\u2705' : result === 'request_changes' ? '\u274c' : '\ud83d\udcac';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `## ${icon} AI Code Review \u2014 Reviewer 1 (Quality)\n\n${review}\n\n---\n*Automated review by AI Reviewer 1 (GPT-4o-mini)*`
            });

      - name: Gate check
        if: always()
        run: |
          RESULT="${{ steps.review.outputs.result }}"
          if [ "$RESULT" = "request_changes" ]; then
            echo "\u274c AI Reviewer 1 found blocking issues. PR needs fixes."
            exit 1
          fi
          echo "\u2705 AI Reviewer 1 passed (result: $RESULT)"

