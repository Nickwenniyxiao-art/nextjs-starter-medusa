  #   if: needs.extract-diff.outputs.has_code_changes == 'true'
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 10
  #   steps:
  #     - name: AI Review — Architecture Consistency
  #       env:
  #         PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
  #       run: |
  #         # Uses Perplexity API
  #         # Prompt focused on architecture patterns, consistency
  #         echo "Reviewer 3 placeholder"

  # ── Summary Gate ─────────────────────────────────────────────
  ai-review-gate:
    needs: [reviewer-1-quality, reviewer-2-security]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all reviewers passed
        run: |
          echo "=== AI Review Summary ==="
          echo "Reviewer 1 (Quality): ${{ needs.reviewer-1-quality.result }}"
          echo "Reviewer 2 (Security): ${{ needs.reviewer-2-security.result }}"

          FAILED=false
          if [ "${{ needs.reviewer-1-quality.result }}" = "failure" ]; then
            FAILED=true
          fi
          if [ "${{ needs.reviewer-2-security.result }}" = "failure" ]; then
            FAILED=true
          fi

          if [ "$FAILED" = "true" ]; then
            echo "❌ One or more AI reviewers flagged blocking issues."
            exit 1
          fi

          echo "✅ All AI reviewers passed. PR is clear for merge."
