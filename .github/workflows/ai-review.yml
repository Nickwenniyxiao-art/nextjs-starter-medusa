  # \u2500\u2500 Summary Gate \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
  ai-review-gate:
    needs: [reviewer-1-quality]
    # When adding reviewers, add them here:
    # needs: [reviewer-1-quality, reviewer-2-security, reviewer-3-architecture]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all reviewers passed
        run: |
          echo "=== AI Review Summary ==="
          echo "Reviewer 1 (Quality): ${{ needs.reviewer-1-quality.result }}"
          # echo "Reviewer 2 (Security): ${{ needs.reviewer-2-security.result }}"
          # echo "Reviewer 3 (Architecture): ${{ needs.reviewer-3-architecture.result }}"

          # Check if any reviewer failed
          if [ "${{ needs.reviewer-1-quality.result }}" = "failure" ]; then
            echo "\u274c One or more AI reviewers flagged blocking issues."
            exit 1
          fi

          echo "\u2705 All AI reviewers passed. PR is clear for merge."

      - name: Auto-approve PR via bot
        if: needs.reviewer-1-quality.result == 'success' || needs.reviewer-1-quality.result == 'skipped'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.BOT_PAT }}
          script: |
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              event: 'APPROVE',
              body: '\u2705 AI Code Review passed \u2014 all reviewers approved.\n\nAutomated approval by @nickwenniyxiao-bot'
            });
            console.log('\u2705 Bot approval submitted for PR #' + context.payload.pull_request.number);
