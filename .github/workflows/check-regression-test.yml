name: Regression Test Required

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: [develop]

permissions:
  contents: read
  pull-requests: read

jobs:
  check-regression-test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - name: Check bug fix has regression test
        uses: actions/github-script@v8
        with:
          script: |
            const prLabels = context.payload.pull_request.labels.map(l => l.name);
            if (!prLabels.includes('type: bug') && !prLabels.includes('bug')) {
              console.log('✅ Not a bug fix PR — skipping');
              return;
            }
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100
            });
            const hasTestChanges = files.some(f =>
              f.filename.includes('.spec.') ||
              f.filename.includes('.test.') ||
              f.filename.includes('__tests__') ||
              f.filename.includes('e2e/')
            );
            if (!hasTestChanges) {
              core.setFailed('❌ Bug 修复 PR 必须包含回归测试脚本（.spec.ts / .test.ts）\n每个 Bug 修复必须防止该 Bug 再次出现。');
            } else {
              console.log('✅ 回归测试检查通过');
            }
