name: "CD — Test"

on:
  push:
    branches: [develop]

concurrency:
  group: cd-test-frontend
  cancel-in-progress: true

jobs:
  wait-for-ci:
    name: "⏳ Wait for CI"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for CI to pass
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.sha;
            for (let i = 1; i <= 30; i++) {
              core.info(`Attempt ${i}/30: checking CI status...`);
              const { data: runs } = await github.rest.actions.listWorkflowRunsForRepo({
                owner, repo, head_sha: sha, event: 'push',
              });
              const ciRun = runs.workflow_runs.find(r => r.name === 'CI');
              if (ciRun) {
                core.info(`CI: ${ciRun.status} / ${ciRun.conclusion}`);
                if (ciRun.status === 'completed') {
                  if (ciRun.conclusion === 'success') {
                    core.info('CI completed successfully');
                    await new Promise(r => setTimeout(r, 10000));
                    return;
                  } else {
                    core.setFailed(`CI failed: ${ciRun.conclusion}`);
                    return;
                  }
                }
              }
              await new Promise(r => setTimeout(r, 15000));
            }
            core.warning('CI did not complete in time, proceeding anyway...');

  deploy-test:
    name: "🚀 Deploy → Test"
    needs: wait-for-ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true  # VPS test env pending full setup — non-blocking
    steps:
      - name: Deploy to test environment
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /opt/nordhjem/storefront-test
            echo "=== Pulling latest (develop) ==="
            git fetch origin develop
            git reset --hard origin/develop

            echo "=== Ensuring .env is correct ==="
            grep -q "^MEDUSA_BACKEND_URL=" .env 2>/dev/null || echo "MEDUSA_BACKEND_URL=http://66.94.127.117:9001" >> .env
            sed -i 's|^MEDUSA_BACKEND_URL=.*|MEDUSA_BACKEND_URL=http://66.94.127.117:9001|' .env

            echo "=== Installing dependencies ==="
            corepack enable
            yarn install

            echo "=== Building ==="
            yarn build

            echo "=== Setting up standalone mode ==="
            cp -r public .next/standalone/public
            cp -r .next/static .next/standalone/.next/static
            cp .env .next/standalone/.env

            echo "=== Restarting PM2 (standalone) ==="
            pm2 delete storefront-test 2>/dev/null || true
            cd /opt/nordhjem/storefront-test
            PORT=8001 HOSTNAME=0.0.0.0 MEDUSA_BACKEND_URL=http://66.94.127.117:9001 \
              pm2 start .next/standalone/server.js --name storefront-test \
              --cwd /opt/nordhjem/storefront-test
            pm2 save
            echo "=== Deploy to test complete ==="

      - name: Health check (test)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 2m
          script: |
            sleep 10
            for i in 1 2 3 4 5; do
              STATUS=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost:8001/en/dk 2>/dev/null || echo "000")
              if [ "$STATUS" = "200" ] || [ "$STATUS" = "307" ] || [ "$STATUS" = "301" ]; then
                echo "✅ Test env health check passed (HTTP $STATUS)"
                exit 0
              fi
              echo "Attempt $i: HTTP $STATUS, waiting 10s..."
              sleep 10
            done
            echo "❌ Health check failed"
            exit 1

  seed-test:
    name: "🌱 Seed → Test"
    needs: deploy-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Seed test environment
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 3m
          script: |
            bash /opt/nordhjem/scripts/seed-env.sh test || echo "⚠️ Seed had warnings (non-fatal)"

            echo "=== Verifying seed data ==="
            PRODUCT_COUNT=$(curl -s http://localhost:9001/store/products | python3 -c "import sys,json; print(len(json.load(sys.stdin).get('products',[])))" 2>/dev/null || echo "0")
            echo "Products in test environment: $PRODUCT_COUNT"
            if [ "$PRODUCT_COUNT" = "0" ]; then
              echo "⚠️ Warning: No products found after seed. E2E tests may skip product-dependent scenarios."
            fi

  e2e-test:
    name: "🧪 E2E → Test"
    needs: seed-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install E2E dependencies
        working-directory: e2e-monitor
        run: npm ci
      - name: Install Playwright browsers
        working-directory: e2e-monitor
        run: npx playwright install chromium --with-deps
      - name: Run E2E tests against test environment
        working-directory: e2e-monitor
        env:
          BASE_URL: http://${{ secrets.DEPLOY_HOST }}:8001
          API_URL: http://${{ secrets.DEPLOY_HOST }}:9001
          PUBLISHABLE_API_KEY: ${{ secrets.PUBLISHABLE_KEY_TEST }}
        run: npx playwright test
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-test
          path: e2e-monitor/playwright-report/
          retention-days: 30

  promote-to-staging:
    name: "🔀 Promote → Staging"
    needs: e2e-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.CD_PAT }}

      - name: Merge develop into staging
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin staging
          git checkout staging
          git merge origin/develop --no-edit
          if [ $? -ne 0 ]; then
            echo "❌ Fast-forward merge failed — staging has diverged from develop."
            echo "Please manually resolve the conflict or reset staging."
            exit 1
          fi
          git push origin staging
